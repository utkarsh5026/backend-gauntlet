[project]
name = "full-text-search"
version = "0.1.0"
description = "An Elasticsearch-lite built from the inverted index up (project 20)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same
# as every other project.
full-text-search = "full_text_search.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # The SPEC asks for three property tests by name: analysis idempotence (V1),
    # BM25 monotonicity in tf (V3), and merge preserving live postings (V4).
    # hypothesis is what generates the corpora those need.
    "hypothesis>=6.115",
    # `httpx` is a dev dep, not a runtime one: this engine talks to nothing over
    # the network — the filesystem IS the index. It is here only to drive the
    # ASGI app in tests.
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/full_text_search"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

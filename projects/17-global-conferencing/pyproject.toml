[project]
name = "global-conferencing"
version = "0.1.0"
description = "A cascaded, multi-region WebRTC SFU: consensus room placement, a loop-free relay mesh, cross-region simulcast routing and server-side recording (project 17)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    # Signaling (publish/subscribe), the inter-SFU cluster RPCs and the admin
    # surface all share one HTTP server. The two media planes -- the
    # participant-facing muxed socket and the SFU<->SFU backbone -- are UDP
    # datagram endpoints opened in the lifespan, not ASGI.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # The Raft-lite placement RPCs (V1) are POSTed node-to-node over HTTP, the
    # same transport project 09 uses. One pooled `httpx.AsyncClient`, a short
    # per-RPC timeout, JSON in and JSON out -- the direct analogue of what
    # `reqwest` was doing in the Rust scaffold.
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]
# Deliberately no Raft library, no WebRTC stack and no media container writer.
# This is a capstone: the consensus is project 09's idea remodelled (V1), the
# relay mesh is yours (V2), and recording persists encoded RTP straight to disk
# (V4). `random`, `struct`, `time` and `pathlib` are stdlib and they are all
# this needs.

[project.scripts]
# Same name the Rust binary had, so the Makefile, Dockerfile and `make mesh`
# read the same as every other project in the gauntlet.
global-conferencing = "global_conferencing.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # The SPEC asks for property tests on the placement state machine ("one
    # home per room") and on relay loop-prevention. Both are claims about
    # *every* interleaving or *every* mesh shape, which is what hypothesis
    # generates and a hand-written list of cases cannot.
    "hypothesis>=6.115",
    "ruff>=0.16.7",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/global_conferencing"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "live-platform"
version = "0.1.0"
description = "Twitch-lite capstone: a stream control plane, autoscaling transcode workers, an LL-HLS edge with request coalescing, and chat fan-out at scale (project 16)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    # One FastAPI app carries every plane's HTTP surface: the ingest webhook,
    # LL-HLS playback, the chat WebSocket and the admin probes. uvicorn[standard]
    # brings uvloop (the production loop) and `websockets` (the chat socket).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # V1 — Postgres is the control plane's source of truth. Raw asyncpg with
    # parameterized SQL rather than an ORM, deliberately: V1's idempotency lesson
    # lives in the schema (the partial unique index `one_active_session_per_stream`)
    # and in the statement that leans on it, and an ORM hides that statement.
    "asyncpg>=0.30",
    # V2 — NATS JetStream is the durable transcode queue. A pull consumer's
    # `ack_wait` is the visibility-timeout lease, so the lease is a broker setting
    # you choose, not a timer you write.
    "nats-py>=2.9",
    # V3 — the edge's origin fills. One pooled AsyncClient reuses keep-alive
    # connections across misses instead of paying a TCP handshake per cold segment.
    "httpx>=0.28",
    # V4 — Redis pub/sub is the cross-pod chat bus. `redis.asyncio` ships inside
    # redis-py; there is no separate aioredis any more.
    "redis>=5.2",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]
# Deliberately absent: an m3u8 library, a caching/single-flight library, and a
# "broadcaster" pub/sub library. Each would hand you a vertical in one import.
# What the verticals actually need is stdlib asyncio: `asyncio.Future` for
# single-flight, `asyncio.Condition` for the blocking playlist reload, and a
# bounded `asyncio.Queue` per chat subscriber.

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same as
# every other project in the gauntlet.
live-platform = "live_platform.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # V1's Proof asks for a property test over the legal-transition matrix and
    # idempotent replay. hypothesis's `RuleBasedStateMachine` drives random
    # sequences of webhooks at the control plane and checks invariants after
    # every step — the direct replacement for the Rust side's `proptest`.
    "hypothesis>=6.115",
    "asyncpg-stubs>=0.30",
    "ruff>=0.16.7",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done. On CPython the Viral Spike is
    # won or lost in the profile, not in code review.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_platform"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

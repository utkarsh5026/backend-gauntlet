[project]
name = "workflow-engine"
version = "0.1.0"
description = "A durable workflow engine (Temporal-lite) — event-sourced history, deterministic replay, durable timers and long-polled worker dispatch (project 21)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    # gRPC is the worker/starter transport (V4): workers long-poll for tasks and
    # report results over it. `grpcio` bundles its own C core, so there is
    # nothing to apt-install — the Python answer to tonic + protoc-bin-vendored.
    "grpcio>=1.68",
    "grpcio-health-checking>=1.68",
    "grpcio-reflection>=1.68",
    "protobuf>=5.28",
    # Postgres is the durable source of truth: the append-only history (V1), the
    # task queues the dispatcher claims from (V4), the timer table (V3). Raw
    # asyncpg rather than an ORM, deliberately — V3's and V4's lessons ARE the
    # SQL (`FOR UPDATE SKIP LOCKED`, one transaction per completion), and an ORM
    # would hide the exact statement the SPEC grades.
    "asyncpg>=0.30",
    # /metrics + /healthz ride a small Starlette app on the same event loop as
    # the gRPC server — see main.py. uvloop comes from uvicorn[standard].
    "starlette>=0.41",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same as
# every other project in the repo.
workflow-engine = "workflow_engine.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Drives the admin app over ASGI, so /healthz and /metrics are tested
    # without binding a socket. (The gRPC side needs a real one — see conftest.)
    "httpx>=0.28",
    # V2's proof asks for a property test: for any valid history, replaying it
    # once equals replaying it twice equals replaying it in two chunks.
    "hypothesis>=6.115",
    "ruff>=0.16.5",
    "pyright>=1.1.390",
    # Codegen + type stubs for it. `grpcio-tools` carries protoc, so `make proto`
    # needs no system protobuf — the Python answer to `protoc-bin-vendored`.
    "grpcio-tools>=1.68",
    "mypy-protobuf>=3.6",
    # grpcio and asyncpg both ship no type information of their own; these are
    # the community stubs that keep pyright strict honest at the call sites.
    "grpc-stubs>=1.53",
    "types-protobuf>=7.35.1.20260827",
    "asyncpg-stubs>=0.30",
    # The profiling gate in the Definition of done.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_engine"]

[tool.pyright]
include = ["src", "tests"]
# Generated protobuf/gRPC code is machine-written and not ours to type-check. It
# still *types* correctly for callers — mypy-protobuf emits .pyi alongside — it
# just isn't held to the strict rules the hand-written code is.
exclude = ["src/workflow_engine/pb"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/workflow_engine/pb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

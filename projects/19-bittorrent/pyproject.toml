[project]
name = "bittorrent"
version = "0.1.0"
description = "A from-scratch BitTorrent client + seeder with an HTTP control plane (project 19)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    # The control plane only — POST /torrents, GET /torrents, /healthz, /metrics.
    # The data plane is raw TCP (the peer wire) and raw UDP (the tracker), because
    # neither peers nor trackers have ever heard of ASGI.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    # The HTTP half of the tracker announce (V3). The UDP half is `asyncio`'s own
    # datagram endpoint and the peer wire is `asyncio.open_connection` — a client
    # library for either would be the exercise, bought.
    "httpx>=0.28",
]
# Deliberately no bencode, no SHA-1, no hex, no base32 and no percent-encoding
# dependency. `hashlib`, `bytes.hex()`, `base64.b32decode`, `struct` and
# `urllib.parse.quote_from_bytes` are all stdlib, and the codec that would
# otherwise be a `uv add` (V1) is the first vertical of the project.

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same as
# every other project in the gauntlet.
bittorrent = "bittorrent.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # The SPEC names a property test by name: `prop_bencode_roundtrips` (V1).
    # Canonical encoding is a claim about *every* value, not about a corpus, and
    # a corpus is exactly what a hand-written test can only ever be.
    "hypothesis>=6.115",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done. On CPython the boss fight is
    # won or lost in the profile, not the code review.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bittorrent"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

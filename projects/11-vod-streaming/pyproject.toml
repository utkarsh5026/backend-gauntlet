[project]
name = "vod-streaming"
version = "0.1.0"
description = "A VOD streaming server: an ISO-BMFF demuxer, an fMP4/CMAF segmenter, HLS/DASH manifests, and byte-range delivery (project 11)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]
# Look at what is *absent*. There is no `pymp4`, no `mp4box` binding, no PyAV and
# no `ffmpeg-python` — reading the container and writing the fragments is the
# entire project, and a dependency that does it would delete V1 and V2. There is
# no XML library either: `xml.etree.ElementTree` is in the standard library and
# is what V3's MPD should be built with (see manifest.py on why hand-rolled XML
# is a bug waiting for an `&` in a filename).
#
# The three modules that do the real work here all ship with CPython:
#   `struct` — big-endian pack/unpack, which is exactly the box wire format;
#   `mmap`   — a whole source file addressable without reading it into RAM;
#   `memoryview` — slicing those bytes without copying them.
# The Rust manifest needed the `bytes` crate for the same three jobs.

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same as
# every other project in the repo.
vod-streaming = "vod_streaming.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # V1's last criterion is a property over *all* malformed inputs, not a list of
    # examples: truncate the fixture at every length and flip random bytes, and the
    # parser must always raise rather than panic, hang, or read out of bounds.
    # This is the `proptest` the Rust manifest declared.
    "hypothesis>=6.115",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done. Muxing is the one genuinely
    # CPU-bound thing in this repo's Python projects, so "where did the seconds
    # go" is a graded question here rather than a nice-to-have.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vod_streaming"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

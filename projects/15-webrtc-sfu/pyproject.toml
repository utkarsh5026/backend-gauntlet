[project]
name = "webrtc-sfu"
version = "0.1.0"
description = "A from-scratch WebRTC SFU: ICE/STUN, per-subscriber RTP rewriting, simulcast selection and bandwidth estimation (project 15)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    # The signaling + admin plane only. The media plane is a raw muxed UDP
    # socket, because neither a browser's ICE agent nor an RTP packet has ever
    # heard of ASGI.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]
# Deliberately no STUN, ICE, RTP or WebRTC dependency, and no crypto package
# either: `hmac`, `hashlib`, `zlib.crc32`, `struct`, `socket` and `ipaddress`
# are all stdlib, and every one of them is stdlib in service of a vertical --
# HMAC-SHA1 and CRC32 are V1's MESSAGE-INTEGRITY and FINGERPRINT. An
# `aiortc` here would buy all four verticals at once, which is the whole
# thing this project exists not to do.

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same as
# every other project in the gauntlet.
webrtc-sfu = "webrtc_sfu.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Test-only: the SFU makes no outbound HTTP calls of its own. `ASGITransport`
    # drives the app on the *test's* event loop, which is what lets a test send
    # a real datagram at the media socket and then await the consequence --
    # Starlette's `TestClient` runs the app on a loop in another thread, where
    # the pump would be out of reach.
    "httpx>=0.28",
    # The SPEC asks for property tests by name on the STUN codec (V1) and the
    # sequence rewriter (V2). Both are claims about *every* input -- "parsing
    # never panics on garbage" is a statement about the whole space of
    # datagrams an open UDP port receives, and a hand-written corpus is
    # exactly the thing that cannot make it.
    "hypothesis>=6.115",
    "ruff>=0.16.6",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done. On CPython the boss fight
    # is won or lost in the profile, not in code review.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webrtc_sfu"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

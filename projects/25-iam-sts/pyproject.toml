[project]
name = "iam-sts"
version = "0.1.0"
description = "Identity, signatures and authorization — IAM + STS from the signature up (project 25)."
requires-python = ">=3.13"
dependencies = [
    "common-aws",
    "common-config",
    "common-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    # The authorizer is called over HTTP by projects 23/24/06; the same client
    # signs outbound requests in the bench harness.
    "httpx>=0.28",
]

[project.scripts]
iam-sts = "iam_sts.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # V1's whole proof is "a request signed by a real AWS SDK verifies unmodified".
    # botocore is that SDK's signer — it is a *test* dependency on purpose, because
    # depending on it at runtime would be borrowing the answer.
    "botocore>=1.35",
    # V2's ARN parsing and condition operators are exactly the shape property
    # tests were invented for.
    "hypothesis>=6.115",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-aws = { workspace = true }
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_sts"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

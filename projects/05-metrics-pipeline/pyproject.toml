[project]
name = "metrics-pipeline"
version = "0.1.0"
description = "A time-series metrics pipeline: line-protocol ingest, windowed rollups with a mergeable sketch, a batched at-least-once ClickHouse sink, and an SSE live feed (project 05)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # The durable log between ingest and the consumer. Pure Python, and it
    # speaks the JetStream primitives V3 reasons about (durable stream, pull
    # consumer, explicit acks, redelivery).
    "nats-py>=2.9",
    # The column store the rollups land in. ClickHouse's own client; its async
    # surface runs the sync driver in a thread executor — see sink.py.
    "clickhouse-connect[async]>=1.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same as
# every other project in the repo.
metrics-pipeline = "metrics_pipeline.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Drives the app over ASGI, so the API is tested without binding a socket.
    "httpx>=0.28",
    # V1's parser is pure and adversarial — property-test the line splitter.
    "hypothesis>=6.115",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrics_pipeline"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

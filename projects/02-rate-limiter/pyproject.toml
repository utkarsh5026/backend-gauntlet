[project]
name = "rate-limiter"
version = "0.1.0"
description = "A distributed rate limiter: token bucket, sliding window, and atomic Redis+Lua decisions over gRPC (project 02)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    # gRPC is the project's protocol axis: HTTP/2 + a .proto contract.
    # `grpcio` bundles its own C core, so there is nothing to apt-install.
    "grpcio>=1.68",
    "grpcio-health-checking>=1.68",
    "grpcio-reflection>=1.68",
    "protobuf>=5.28",
    # The shared limiter state (V3). `redis.asyncio` is the async client.
    "redis>=5.2",
    # /metrics + /healthz ride a small Starlette app on the same event loop as
    # the gRPC server — see main.py. uvloop comes from uvicorn[standard].
    "starlette>=0.41",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same
# as every other project in the repo.
rate-limiter = "rate_limiter.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Drives the admin app over ASGI, so /healthz and /metrics are tested
    # without binding a socket. (The gRPC side needs a real one — see conftest.)
    "httpx>=0.28",
    # V1's proof asks for a property test (many refills never drift the budget).
    "hypothesis>=6.115",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # Codegen + type stubs for it. `grpcio-tools` carries protoc, so `make proto`
    # needs no system protobuf — the Python answer to `protoc-bin-vendored`.
    "grpcio-tools>=1.68",
    "mypy-protobuf>=3.6",
    # grpcio itself ships no type information; these are the community stubs.
    "grpc-stubs>=1.53",
    "types-protobuf>=5.28",
    # The profiling gate in the Definition of done.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rate_limiter"]

[tool.pyright]
include = ["src", "tests"]
# Generated protobuf/gRPC code is machine-written and not ours to type-check.
# It still *types* correctly for callers — mypy-protobuf emits .pyi alongside —
# it just isn't held to the strict rules the hand-written code is.
exclude = ["src/rate_limiter/pb"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/rate_limiter/pb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

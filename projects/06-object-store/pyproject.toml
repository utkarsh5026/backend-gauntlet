[project]
name = "object-store"
version = "0.1.0"
description = "An S3-compatible object store: content-addressed blobs, streaming bodies, a crash-safe key index, and multipart uploads (project 06)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    # The index-as-a-service split: `RemoteIndex` speaks HTTP JSON to the
    # `object-store-index` process. Also what the tests drive the ASGI app with.
    "httpx>=0.28",
]
# Look hard at what is *absent*. There is no `boto3`, no `minio`, no S3 SDK of
# any kind — the whole project is building the server side of that protocol, and
# a client library would not help. There is no XML library either: the emit side
# is hand-rolled string building over four fixed schemas, and the parse side is
# `xml.etree.ElementTree` from the standard library.
#
# There is no chunking, erasure-coding or compression dependency, because those
# three *are* the labs: `fastcdc`, `reedsolo` and `zstandard` would each delete
# the thing they were added to help with. The cold tier prefers CPython 3.14's
# `compression.zstd` when it is there and falls back to stdlib zlib when it is
# not, since the graded lesson is hash-then-compress identity, not the codec.
#
# The four modules doing the real work all ship with CPython:
#   `hashlib`   — SHA-256 (content addresses) and MD5 (S3 ETags), and it
#                 releases the GIL on large buffers, which is what makes the
#                 threaded stream loop worth anything;
#   `os`        — `fsync`, `replace`, and opening a directory to fsync it, which
#                 is the entire durable-commit dance;
#   `struct`    — the little-endian needle header in the Haystack volumes;
#   `hmac`      — presigned-URL signing, including `compare_digest`.

[project.scripts]
# Same names the Rust binaries had, so the Makefile, Dockerfile and compose file
# read the same as every other project in the repo.
object-store = "object_store.main:main"
object-store-index = "object_store.index_main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.16.6",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done. This project has two
    # genuinely CPU-bound paths — hashing on PUT and the scrubber's re-hash — so
    # "where did the seconds go" is a graded question rather than a nicety.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/object_store"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

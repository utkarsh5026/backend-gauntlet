[project]
name = "realtime-pubsub"
version = "0.1.0"
description = "A real-time WebSocket pub/sub server: an in-process fan-out hub, per-connection backpressure, presence as soft state, and a Redis cross-node bus (project 03)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    "fastapi>=0.115",
    # [standard] pulls uvloop + httptools + the `websockets` implementation
    # uvicorn needs to serve `GET /ws`. Without it the WebSocket route 500s.
    "uvicorn[standard]>=0.32",
    # The cross-node bus (V4). redis-py's asyncio client is the same package —
    # `redis.asyncio` — so there is no separate aioredis dependency any more.
    "redis>=5.2",
    # The directory (admin-panel roster) persists people/groups/memberships in
    # Postgres. Playground scaffolding — NOT part of the store-free pub/sub core
    # (V1-V4); gated behind an optional DATABASE_URL. See directory.py.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same as
# every other project in the repo.
realtime-pubsub = "realtime_pubsub.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Drives the app over ASGI, so the HTTP surface is tested without binding a
    # socket. WebSocket tests use Starlette's TestClient instead — see
    # tests/conftest.py for why httpx can't do that one.
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realtime_pubsub"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

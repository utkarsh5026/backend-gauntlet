[project]
name = "sqs-queue"
version = "0.1.0"
description = "A managed queue service — receipt handles, FIFO groups, dedup and long polling (project 29)."
requires-python = ">=3.13"
dependencies = [
    "common-aws",
    "common-config",
    "common-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    # The SigV4 horizontal calls project 25's authorization endpoint over HTTP
    # rather than re-deriving identity here — one identity service, many callers,
    # which is the whole reason 25 exists.
    "httpx>=0.28",
]

[project.scripts]
sqs-queue = "sqs_queue.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # The protocol horizontal's bar is "a real AWS SDK works against this
    # unmodified". boto3 is a *test* dependency for exactly that reason: it is
    # the reference client, not a thing the service depends on.
    "boto3>=1.35",
    # Ordering within a group, dedup-window behaviour and receipt-handle
    # validity are all invariants over generated sequences — property-test shaped.
    "hypothesis>=6.115",
    "ruff>=0.16.5",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-aws = { workspace = true }
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqs_queue"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

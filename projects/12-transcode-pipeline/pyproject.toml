[project]
name = "transcode-pipeline"
version = "0.1.0"
description = "Distributed transcoding pipeline: keyframe-aligned chunking, a durable job DAG, idempotent parallel ffmpeg workers, and a seamless stitch/remux (project 12)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    # The control-plane API. uvicorn[standard] brings uvloop, the production loop.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Postgres is the coordinator's durable memory: the job DAG (tasks, edges,
    # status, leases) lives in rows. Raw asyncpg with parameterized SQL rather than
    # an ORM, deliberately: V2's readiness rule and V3's `FOR UPDATE SKIP LOCKED`
    # claim *are* SQL statements, and the SPEC grades them. An ORM hides them.
    "asyncpg>=0.30",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]
# Deliberately absent: ffmpeg-python, PyAV, and any DAG/workflow library. ffmpeg is
# driven through `asyncio.create_subprocess_exec` with an argv list (see
# `ffmpeg.py`) — a wrapper that builds a shell string would reintroduce the
# injection the security checklist forbids. And a DAG library would hand you V2 in
# one import: the whole point is that the graph is rows you schedule yourself.

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same as
# every other project in the gauntlet.
transcode-pipeline = "transcode_pipeline.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # httpx's ASGITransport runs the app on the test's own loop (see conftest).
    "httpx>=0.28",
    # V1's Proof is property tests over random keyframe lists — hypothesis is the
    # direct replacement for the Rust side's `proptest`.
    "hypothesis>=6.115",
    "asyncpg-stubs>=0.30",
    "ruff>=0.16.7",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done: numbers alone do not close it.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcode_pipeline"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

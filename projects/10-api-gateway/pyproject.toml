[project]
name = "api-gateway"
version = "0.1.0"
description = "An L7 API gateway / reverse proxy: a streaming forwarding core, a routing engine, a load balancer, and circuit breaking (project 10)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # The proxy engine itself. `httpx.AsyncClient` is this project's `hyper-util`
    # legacy client: one long-lived client owns a per-host connection pool, so
    # keep-alive reuse is a property of *holding onto the client* rather than
    # something you implement (V1). It is also the only mainstream Python HTTP
    # client that can stream a request body in and a response body out without
    # materializing either — which is the whole of V1's memory-bounded criterion.
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]
# No routing library, no load-balancer library, no circuit-breaker library —
# those four are the project. Note also what is *absent* next to the Rust
# manifest: no serde (the route table is `json` + pydantic), and no rustls
# (Python's TLS is `ssl` in the standard library, which is why `tls.py` builds
# `SSLContext`s rather than pulling in a TLS stack).

[project.scripts]
# Same name the Rust binary had, so the Makefile, Dockerfile and compose file
# read the same as every other project in the repo.
api-gateway = "api_gateway.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # V2 wants longest-prefix precedence to hold for *any* route table, and V3
    # wants a fair spread over *any* healthy pool. Both are properties over
    # generated inputs rather than examples — this is the `proptest` the Rust
    # manifest declared.
    "hypothesis>=6.115",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done. A proxy is judged on the
    # latency it *adds*, so "where did the microseconds go" is a graded question.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

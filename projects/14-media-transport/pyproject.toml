[project]
name = "media-transport"
version = "0.1.0"
description = "Real-time media transport from scratch: RTP packetization, a jitter buffer, RTCP/NACK recovery and congestion control over UDP (project 14)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    # The admin/observability plane only — health probes and the Prometheus
    # scrape. The media plane is a raw UDP socket, because an RTP packet has
    # never heard of ASGI and never will.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]
# Deliberately no RTP, RTCP, jitter-buffer or congestion-control dependency.
# `aiortc` would hand you all four verticals in one line, which is the whole
# thing this project exists not to do. What the verticals actually need is
# stdlib: `struct` for the big-endian wire layouts, `bisect`/`collections` for
# the ordered buffer and the retransmit ring, `time.monotonic` for the playout
# clock, and `random` for the RFC 3550 randomised SSRC.

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same
# as every other project in the gauntlet.
media-transport = "media_transport.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Test-only: this process makes no outbound HTTP calls of its own.
    # `ASGITransport` drives the app on the *test's* event loop, which is what
    # lets a test send a real datagram at the media socket and then await the
    # consequence — Starlette's `TestClient` runs the app on a loop in another
    # thread, where the session task would be out of reach.
    "httpx>=0.28",
    # The SPEC names a property test by name: `playout_is_always_ordered` is a
    # claim about *every* insertion order, and "the parsers never crash on
    # garbage" is a claim about the whole space of datagrams an open UDP port
    # receives. A hand-written corpus is exactly the thing that cannot make
    # either claim.
    "hypothesis>=6.115",
    "ruff>=0.16.6",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done. On CPython the boss fight
    # is won or lost in the profile, not in code review.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_transport"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

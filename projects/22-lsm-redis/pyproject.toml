[project]
name = "lsm-redis"
version = "0.1.0"
description = "An LSM storage engine behind a redis-compatible RESP server (project 22)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    # The HTTP sidecar only — /healthz, /stats, /metrics. The data plane is a raw
    # asyncio TCP server, because `redis-cli` speaks RESP over a socket and does
    # not know what an ASGI app is.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]
# Deliberately no third-party CRC, framing, hashing, sorted-container or LRU
# library. `zlib.crc32`, `struct`, `hashlib`, `bisect` and `collections.OrderedDict`
# are all stdlib, and the Rust build only pulled `crc32fast` because Rust's std
# ships no CRC. The verticals that would otherwise be a `uv add` — the bloom (V5)
# and the block cache (V7) — are the point of the project.

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same as
# every other project in the gauntlet.
lsm-redis = "lsm_redis.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # The SPEC asks for property proofs where correctness is an invariant rather
    # than an example: the RESP codec round-trip (V1), WAL replay (V2), memtable
    # ordering (V3), and above all the bloom's no-false-negatives guarantee (V5),
    # which is a claim about *every* key you could insert.
    "hypothesis>=6.115",
    "ruff>=0.16.5",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done. On CPython the boss fight is
    # won or lost in the profile, not the code review.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsm_redis"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "message-broker"
version = "0.1.0"
description = "A Kafka-lite message broker built from the log up (project 08)."
requires-python = ">=3.13"
dependencies = [
    "common-config",
    "common-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]
# No CRC or framing library on purpose: `zlib.crc32` and `struct` are stdlib,
# and the Rust build only pulled `crc32fast` because Rust's std has no CRC.

[project.scripts]
# Same name the Rust binary had, so the Makefile and Dockerfile read the same
# as every other project.
message-broker = "message_broker.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # V1 asks for a framing round-trip proof and V3 for key-stability /
    # keyless-spread — both are properties over generated inputs, not examples.
    "hypothesis>=6.115",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # The profiling gate in the Definition of done.
    "py-spy>=0.4",
    "memray>=1.14",
]

[tool.uv.sources]
common-config = { workspace = true }
common-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/message_broker"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

name: Nightly

# Every Python project + every frontend. Catches drift that path-filtered PR CI
# misses (a dependency bump in uv.lock, a flaky test, a frontend nobody touched).

on:
  schedule:
    # 06:17 UTC — avoid the top-of-hour stampede on GitHub-hosted runners.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  python:
    name: every project's verify gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: sync the uv workspace
        run: uv sync --all-packages --frozen
      - name: shared packages
        run: |
          set -euo pipefail
          uv run ruff format --check packages
          uv run ruff check packages
          for pkg in packages/*/pyproject.toml; do
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            (
              cd "$dir"
              uv run pyright
              if [ -d tests ]; then uv run pytest -q; fi
            )
            echo "::endgroup::"
          done
      - name: bootstrap script
        run: |
          uv run ruff format --check bootstrap.py tools/tests
          uv run ruff check bootstrap.py tools/tests
          uv run pyright bootstrap.py
          uv run pytest -q tools/tests
      - name: per-project verify
        run: |
          set -euo pipefail
          for proj in projects/*/pyproject.toml; do
            dir=$(dirname "$proj")
            echo "::group::$dir"
            (
              cd "$dir"
              uv run ruff format --check .
              uv run ruff check .
              uv run pyright
              uv run pytest -q
            )
            echo "::endgroup::"
          done

  frontend:
    name: all bun frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve all frontend dirs
        id: fe
        env:
          CI_FORCE_ALL: "true"
        run: python3 tools/ci_resolve_packages.py
      - name: bun install + build
        env:
          FRONTEND_DIRS: ${{ steps.fe.outputs.frontend_dirs }}
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "::group::frontend $dir"
            if [ -f "$dir/bun.lock" ] || [ -f "$dir/bun.lockb" ]; then
              bun install --frozen-lockfile --cwd "$dir"
            else
              bun install --cwd "$dir"
            fi
            bun run --cwd "$dir" build
            echo "::endgroup::"
          done <<< "$FRONTEND_DIRS"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

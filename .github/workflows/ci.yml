name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Force all frontends"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend_any: ${{ steps.resolve.outputs.frontend_any }}
      frontend_dirs: ${{ steps.resolve.outputs.frontend_dirs }}
      python_any: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Single catch-all → JSON file list. Frontend scope is decided in
          # tools/ci_resolve_packages.py (avoids dorny `!` negation false-positives).
          list-files: json
          filters: |
            any:
              - '**'
            python:
              - 'projects/**/*.py'
              - 'projects/**/pyproject.toml'
              - 'packages/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'bootstrap.py'
              - 'tools/tests/**'
      - name: Resolve frontend scope
        id: resolve
        env:
          # boolean inputs arrive as strings on workflow_dispatch; empty on PR/push.
          CI_FORCE_ALL: ${{ github.event.inputs.full == 'true' }}
          CHANGED_FILES_JSON: ${{ steps.filter.outputs.any_files }}
        run: python3 tools/ci_resolve_packages.py

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: ruff + pyright + pytest
    needs: changes
    if: needs.changes.outputs.python_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: sync the uv workspace
        # --frozen: the committed uv.lock is authoritative. A stale lock fails here.
        run: uv sync --all-packages --frozen
      - name: shared packages
        # The `common-*` helpers are fully implemented and reused by every
        # project, so a break here breaks everything downstream — they get the
        # same gate a project does. pytest only where a package ships tests.
        run: |
          set -euo pipefail
          uv run ruff format --check packages
          uv run ruff check packages
          for pkg in packages/*/pyproject.toml; do
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            (
              cd "$dir"
              uv run pyright
              if [ -d tests ]; then uv run pytest -q; fi
            )
            echo "::endgroup::"
          done
      - name: bootstrap script
        # bootstrap.py is what a new contributor runs before anything else works,
        # so it is held to the same bar as the projects it sets up.
        run: |
          uv run ruff format --check bootstrap.py tools/tests
          uv run ruff check bootstrap.py tools/tests
          uv run pyright bootstrap.py
          uv run pytest -q tools/tests
      - name: per-project verify
        # Same gate as `make verify` in each project, so green here means green
        # locally. Scoped per project because each owns its ruff/pyright config.
        run: |
          set -euo pipefail
          for proj in projects/*/pyproject.toml; do
            dir=$(dirname "$proj")
            echo "::group::$dir"
            (
              cd "$dir"
              uv run ruff format --check .
              uv run ruff check .
              uv run pyright
              uv run pytest -q
            )
            echo "::endgroup::"
          done

  frontend:
    name: bun frontends
    needs: changes
    if: needs.changes.outputs.frontend_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun install + build
        env:
          FRONTEND_DIRS: ${{ needs.changes.outputs.frontend_dirs }}
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "::group::frontend $dir"
            # Prefer frozen lockfile when bun.lock exists; fall back otherwise
            # (e.g. 01-url-shortener/dashboard ships package-lock.json only).
            if [ -f "$dir/bun.lock" ] || [ -f "$dir/bun.lockb" ]; then
              bun install --frozen-lockfile --cwd "$dir"
            else
              bun install --cwd "$dir"
            fi
            bun run --cwd "$dir" build
            echo "::endgroup::"
          done <<< "$FRONTEND_DIRS"

  # Single required-check target: skipped jobs count as OK.
  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, secrets, python, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          SECRETS: ${{ needs.secrets.result }}
          PYTHON: ${{ needs.python.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          set -euo pipefail
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          echo "changes=$CHANGES secrets=$SECRETS python=$PYTHON frontend=$FRONTEND"
          [ "$CHANGES" = "success" ]
          [ "$SECRETS" = "success" ]
          ok "$PYTHON"
          ok "$FRONTEND"
          echo "All CI gates passed"

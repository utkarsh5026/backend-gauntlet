[project]
name = "common-telemetry"
version = "0.1.0"
description = "Structured logging + Prometheus metrics shared by backend-gauntlet projects."
requires-python = ">=3.13"
dependencies = [
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "starlette>=0.41",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_telemetry"]

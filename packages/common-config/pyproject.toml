[project]
name = "common-config"
version = "0.1.0"
description = "Shared env/dotenv configuration helpers for backend-gauntlet projects."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_config"]
